<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340">
<style>
rect.box-gray{fill:#F1EFE8;stroke:#5F5E5A;} rect.box-teal{fill:#E1F5EE;stroke:#0F6E56;}
rect.box-purple{fill:#EEEDFE;stroke:#534AB7;} rect.box-red{fill:#FCEBEB;stroke:#A32D2D;}
text.th{font-family:sans-serif;font-size:14px;font-weight:600;fill:#26215C;}
text.th-teal{font-family:sans-serif;font-size:14px;font-weight:600;fill:#04342C;}
text.th-red{font-family:sans-serif;font-size:14px;font-weight:600;fill:#501313;}
text.th-gray{font-family:sans-serif;font-size:14px;font-weight:600;fill:#2C2C2A;}
text.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="box-gray" x="40" y="130" width="100" height="56" rx="8" stroke-width="0.8"/>
<text class="th-gray" x="90" y="152" text-anchor="middle" dominant-baseline="central">LLM app</text>
<text class="ts" x="90" y="172" text-anchor="middle" dominant-baseline="central">sends request</text>

<line x1="140" y1="158" x2="176" y2="158" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-teal" x="178" y="100" width="150" height="120" rx="10" stroke-width="0.8"/>
<text class="th-teal" x="253" y="126" text-anchor="middle" dominant-baseline="central">Guardrail sidecar</text>
<rect x="194" y="142" width="118" height="30" rx="5" fill="none" stroke="#0F6E56" stroke-width="0.6"/>
<text class="ts" x="253" y="157" text-anchor="middle" dominant-baseline="central">PII detection</text>
<rect x="194" y="178" width="118" height="30" rx="5" fill="none" stroke="#0F6E56" stroke-width="0.6"/>
<text class="ts" x="253" y="193" text-anchor="middle" dominant-baseline="central">Injection check</text>

<line x1="253" y1="100" x2="253" y2="68" stroke="#E24B4A" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect class="box-red" x="178" y="30" width="150" height="36" rx="8" stroke-width="0.8"/>
<text class="th-red" x="253" y="48" text-anchor="middle" dominant-baseline="central">Blocked + logged</text>
<text class="ts" x="316" y="84" dominant-baseline="central" fill="#A32D2D">policy violation</text>

<line x1="328" y1="158" x2="396" y2="158" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="362" y="148" text-anchor="middle">pass</text>

<rect class="box-purple" x="398" y="130" width="120" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="458" y="152" text-anchor="middle" dominant-baseline="central">LLM provider</text>
<text class="ts" x="458" y="172" text-anchor="middle" dominant-baseline="central">GPT-4o · Claude · etc.</text>

<line x1="458" y1="186" x2="458" y2="250" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-teal" x="398" y="252" width="120" height="50" rx="8" stroke-width="0.8"/>
<text class="th-teal" x="458" y="272" text-anchor="middle" dominant-baseline="central">Output check</text>
<text class="ts" x="458" y="290" text-anchor="middle" dominant-baseline="central">schema · toxicity</text>

<path d="M398 277 L190 277 L140 186" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="296" text-anchor="middle">validated response</text>

<text class="ts" x="40" y="320" dominant-baseline="central">Zero app code changes required — transparent proxy layer</text>
</svg>
