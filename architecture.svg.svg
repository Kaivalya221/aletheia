<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
<style>
rect.box-purple{fill:#EEEDFE;stroke:#534AB7;} rect.box-teal{fill:#E1F5EE;stroke:#0F6E56;}
rect.box-gray{fill:#F1EFE8;stroke:#5F5E5A;} rect.box-blue{fill:#E6F1FB;stroke:#185FA5;}
text.th{font-family:sans-serif;font-size:14px;font-weight:600;fill:#26215C;}
text.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A;}
text.th-teal{font-family:sans-serif;font-size:14px;font-weight:600;fill:#04342C;}
text.th-gray{font-family:sans-serif;font-size:14px;font-weight:600;fill:#2C2C2A;}
text.th-blue{font-family:sans-serif;font-size:14px;font-weight:600;fill:#042C53;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="box-purple" x="40" y="40" width="140" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="110" y="62" text-anchor="middle" dominant-baseline="central">Your LLM app</text>
<text class="ts" x="110" y="82" text-anchor="middle" dominant-baseline="central">SDK instrumented</text>

<line x1="180" y1="68" x2="248" y2="68" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<text class="ts" x="214" y="60" text-anchor="middle">traces</text>

<rect class="box-purple" x="250" y="40" width="140" height="56" rx="8" stroke-width="0.8"/>
<text class="th" x="320" y="62" text-anchor="middle" dominant-baseline="central">Ingestion API</text>
<text class="ts" x="320" y="82" text-anchor="middle" dominant-baseline="central">Node.js · tRPC · REST</text>

<line x1="320" y1="96" x2="160" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="96" x2="320" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="96" x2="480" y2="158" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="box-teal" x="60" y="160" width="140" height="56" rx="8" stroke-width="0.8"/>
<text class="th-teal" x="130" y="182" text-anchor="middle" dominant-baseline="central">Guardrail proxy</text>
<text class="ts" x="130" y="202" text-anchor="middle" dominant-baseline="central">Express · Zod policies</text>

<rect class="box-gray" x="250" y="160" width="140" height="56" rx="8" stroke-width="0.8"/>
<text class="th-gray" x="320" y="182" text-anchor="middle" dominant-baseline="central">Worker queue</text>
<text class="ts" x="320" y="202" text-anchor="middle" dominant-baseline="central">Redis · BullMQ jobs</text>

<rect class="box-gray" x="400" y="160" width="65" height="56" rx="8" stroke-width="0.8"/>
<text class="th-gray" x="432" y="182" text-anchor="middle" dominant-baseline="central">Postgres</text>
<text class="ts" x="432" y="202" text-anchor="middle" dominant-baseline="central">Prisma ORM</text>

<rect class="box-gray" x="480" y="160" width="100" height="56" rx="8" stroke-width="0.8"/>
<text class="th-gray" x="530" y="182" text-anchor="middle" dominant-baseline="central">ClickHouse</text>
<text class="ts" x="530" y="202" text-anchor="middle" dominant-baseline="central">Wide events</text>

<line x1="130" y1="216" x2="250" y2="290" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="216" x2="320" y2="290" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="432" y1="216" x2="360" y2="290" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="530" y1="216" x2="390" y2="290" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect class="box-blue" x="200" y="292" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="th-blue" x="320" y="314" text-anchor="middle" dominant-baseline="central">Web dashboard</text>
<text class="ts" x="320" y="334" text-anchor="middle" dominant-baseline="central">Next.js · traces · evals · diffs</text>

<text class="ts" x="40" y="378" dominant-baseline="central">Aletheia v3 · monorepo · pnpm + Turborepo</text>
</svg>
