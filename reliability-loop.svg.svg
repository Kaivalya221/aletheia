<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280">
<style>
rect.box-gray{fill:#F1EFE8;stroke:#5F5E5A;} rect.box-purple{fill:#EEEDFE;stroke:#534AB7;}
rect.box-teal{fill:#E1F5EE;stroke:#0F6E56;} rect.box-green{fill:#EAF3DE;stroke:#3B6D11;}
text.th{font-family:sans-serif;font-size:13px;font-weight:600;}
text.ts{font-family:sans-serif;font-size:11px;fill:#5F5E5A;}
.th-gray{fill:#2C2C2A;} .th-purple{fill:#26215C;} .th-teal{fill:#04342C;} .th-green{fill:#173404;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="box-gray" x="30" y="90" width="86" height="56" rx="8" stroke-width="0.8"/>
<text class="th th-gray" x="73" y="112" text-anchor="middle" dominant-baseline="central">Develop</text>
<text class="ts" x="73" y="132" text-anchor="middle" dominant-baseline="central">write prompts</text>

<line x1="116" y1="118" x2="134" y2="118" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-purple" x="136" y="90" width="86" height="56" rx="8" stroke-width="0.8"/>
<text class="th th-purple" x="179" y="112" text-anchor="middle" dominant-baseline="central">Trace</text>
<text class="ts" x="179" y="132" text-anchor="middle" dominant-baseline="central">capture calls</text>

<line x1="222" y1="118" x2="240" y2="118" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-purple" x="242" y="90" width="86" height="56" rx="8" stroke-width="0.8"/>
<text class="th th-purple" x="285" y="112" text-anchor="middle" dominant-baseline="central">Evaluate</text>
<text class="ts" x="285" y="132" text-anchor="middle" dominant-baseline="central">score outputs</text>

<line x1="328" y1="118" x2="346" y2="118" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-teal" x="348" y="90" width="72" height="56" rx="8" stroke-width="0.8"/>
<text class="th th-teal" x="384" y="112" text-anchor="middle" dominant-baseline="central">Guard</text>
<text class="ts" x="384" y="132" text-anchor="middle" dominant-baseline="central">enforce policies</text>

<line x1="420" y1="118" x2="438" y2="118" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-teal" x="440" y="90" width="72" height="56" rx="8" stroke-width="0.8"/>
<text class="th th-teal" x="476" y="112" text-anchor="middle" dominant-baseline="central">Diff</text>
<text class="ts" x="476" y="132" text-anchor="middle" dominant-baseline="central">compare versions</text>

<line x1="512" y1="118" x2="530" y2="118" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect class="box-green" x="532" y="90" width="108" height="56" rx="8" stroke-width="0.8"/>
<text class="th th-green" x="586" y="112" text-anchor="middle" dominant-baseline="central">Ship</text>
<text class="ts" x="586" y="132" text-anchor="middle" dominant-baseline="central">deploy confidently</text>

<path d="M586 146 Q586 220 73 220 Q73 180 73 146" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="240" text-anchor="middle">continuous loop — every release</text>

<text class="ts" x="73" y="58" text-anchor="middle" fill="#888780">SDK</text>
<text class="ts" x="179" y="58" text-anchor="middle" fill="#534AB7">spans · sessions</text>
<text class="ts" x="285" y="58" text-anchor="middle" fill="#534AB7">LLM-as-judge</text>
<text class="ts" x="384" y="58" text-anchor="middle" fill="#0F6E56">sidecar proxy</text>
<text class="ts" x="476" y="58" text-anchor="middle" fill="#0F6E56">regression engine</text>
<text class="ts" x="586" y="58" text-anchor="middle" fill="#3B6D11">pass / fail signal</text>
</svg>
